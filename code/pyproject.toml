[project]
name = "claimledger"
version = "1.0.0"
description = "Claim-level memory integrity layer and evaluation scaffold for agent memory research"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Yash Kumar Singh", email = "yashkumarsingh.work@gmail.com" }
]
dependencies = []

[project.scripts]
claimledger = "claimledger.cli:main"

# The configured profile uses the locally obtained official REALTALK release.
# Raw files remain outside Git; the preparation manifest records provenance,
# consent/usage notes, source commit, and hashes before the run is executed.
[tool.claimledger.experiment]
name = "claimledger-realtalk"
datasets = ["realtalk_memory_probes"]
systems = ["claimledger", "naive", "recency_memory", "summary_memory", "vector_rag", "structured_fact_store", "temporal_only", "provenance_only", "no_conflict", "no_temporal", "trust_only", "no_ledger_oracle_labels"]
seeds = [0, 1, 2]
models = []
output_dir = "data/results/runs"

# Primary local Ollama matrix for the submission-grade end-to-end evaluation.
# The deterministic mechanism runner does not consume these values; the
# resumable multi-LLM runner will validate the tags against `ollama list`.
[tool.claimledger.multillm]
models = ["qwen3:4b", "gemma3:4b", "phi4-mini:latest"]
embedding_model = "qwen3-embedding:4b"
temperature = 0.0
seeds = [0, 1, 2]
max_output_tokens = 256
num_ctx = 8192
timeout_seconds = 180

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# The repository intentionally keeps the implementation modules directly under
# src/. The mappings below expose that layout as the installed claimledger
# package without reintroducing a src/claimledger/ directory.
[tool.setuptools]
packages = [
  "claimledger",
  "claimledger.core",
  "claimledger.datasets",
  "claimledger.baselines",
  "claimledger.evaluation",
  "claimledger.integrations",
  "claimledger.storage",
  "claimledger.extraction",
  "claimledger.retrieval",
  "claimledger.attacks",
]
[tool.setuptools.package-dir]
claimledger = "src"

[dependency-groups]
dev = [
    "kaleido>=1.3.0",
    "plotly>=6.9.0",
]
